CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_LOG_BUFFER_SIZE=1024

# Enable SPI subsystem
CONFIG_SPI=y

# Enable Display subsystem and the specific driver
CONFIG_DISPLAY=y
CONFIG_SSD1306=y

# Enable LVGL GUI framework
CONFIG_LVGL=y
# Allocate a dedicated memory pool for LVGL objects
CONFIG_LV_Z_MEM_POOL_SIZE=8192
# Tell LVGL we are on a 1-bit monochrome OLED
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y

# Quadrature decoder only needs generic sensor API
CONFIG_SENSOR=y

# Enable Input Subsystem
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y
CONFIG_INPUT_LONGPRESS=y

# Enable the serial driver
CONFIG_SERIAL=y

# DISABLE console and the raw UART backend so it doesn't double print
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Enable shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART=">"

# Enable the logging subsystem
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
# Redirect standard printk messages into the Logger engine
CONFIG_LOG_PRINTK=y

# Setup BT module comms
CONFIG_MODEM_MODULES=y
CONFIG_MODEM_CHAT=y
CONFIG_MODEM_BACKEND_UART=y
CONFIG_UART_INTERRUPT_DRIVEN=y